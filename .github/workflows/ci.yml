name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 渲染器的中文字体候选链里包含 Noto Sans CJK；runner 默认没装。
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Python renderer tests (21)
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Plugin entry self-test (12)
        run: node tools/selftest.mjs
